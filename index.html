<script>
    let chart;

    function parseFredValue(item) {
        if (!item || item.value === "." || isNaN(parseFloat(item.value))) return null;
        return parseFloat(item.value);
    }

    function getLastValidValue(observations) {
        for (let obs of observations) {
            const val = parseFredValue(obs);
            if (val !== null) return val;
        }
        return 0;
    }

    async function fetchFredSeries(seriesId, apiKey) {
        const targetUrl = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${apiKey}&file_type=json&sort_order=desc&limit=40`;
        
        // Proxy compatible con sitios web alojados en GitHub Pages
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (!data || !data.observations) {
            throw new Error("Respuesta de datos vacía");
        }
        return data.observations;
    }

    async function fetchAllData() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert("Por favor, introduce tu API Key de FRED.");
            return;
        }

        const btn = document.getElementById('btnFetch');
        btn.innerText = "CARGANDO DATOS...";
        btn.classList.add('loading');

        try {
            const balance = await fetchFredSeries('WALCL', apiKey);
            const tga = await fetchFredSeries('WTREGEN', apiKey);
            const rrp = await fetchFredSeries('RRPONTSYD', apiKey);
            const hy = await fetchFredSeries('BAMLH0A0HYM2', apiKey);
            const realRate = await fetchFredSeries('DFII10', apiKey);

            const latestHy = getLastValidValue(hy);
            const latestRealRate = getLastValidValue(realRate);

            const lastKnownTga = getLastValidValue(tga);
            const lastKnownRrp = getLastValidValue(rrp);

            const netLiquidityData = [];

            for (let i = 0; i < balance.length; i++) {
                const bVal = parseFredValue(balance[i]);
                if (bVal === null) continue;

                const tVal = parseFredValue(tga[i]) ?? lastKnownTga;
                const rVal = parseFredValue(rrp[i]) ?? lastKnownRrp;

                const netLiqTrillions = (bVal - tVal - (rVal * 1000)) / 1000000;

                netLiquidityData.push({
                    date: balance[i].date,
                    val: netLiqTrillions
                });
            }

            const currentLiq = netLiquidityData[0]?.val || 0;
            const prevLiq = netLiquidityData[2]?.val || currentLiq;

            document.getElementById('netLiq').innerText = `${currentLiq.toFixed(2)}T`;
            document.getElementById('hyOas').innerText = `${latestHy.toFixed(2)}%`;
            document.getElementById('realRate').innerText = `${latestRealRate.toFixed(2)}%`;

            document.getElementById('techRegime').innerText = "ALCISTA";
            document.getElementById('techRegime').style.color = "var(--up)";

            const signalBox = document.getElementById('mainSignal');
            const isLiqGrowing = currentLiq > prevLiq;
            const isCreditSafe = latestHy < 4.5;

            if (isLiqGrowing && isCreditSafe) {
                signalBox.innerText = "SEÑAL: EXPANSIÓN AGRESIVA (RISK-ON)";
                signalBox.style.backgroundColor = "rgba(35, 134, 54, 0.2)";
                signalBox.style.borderColor = "var(--up)";
            } else if (latestHy > 5) {
                signalBox.innerText = "SEÑAL: MÁXIMA PRECAUCIÓN (DEFENSIVO)";
                signalBox.style.backgroundColor = "rgba(218, 54, 51, 0.2)";
                signalBox.style.borderColor = "var(--down)";
            } else {
                signalBox.innerText = "SEÑAL: NEUTRAL / TRANSICIÓN";
                signalBox.style.backgroundColor = "rgba(212, 175, 55, 0.1)";
                signalBox.style.borderColor = "var(--gold)";
            }

            renderChart(netLiquidityData.slice(0, 12).reverse());

        } catch (error) {
            console.error("Detalle del error:", error);
            alert("Error al cargar datos: " + error.message);
        } finally {
            btn.innerText = "ACTUALIZAR DATOS REALES";
            btn.classList.remove('loading');
        }
    }

    function renderChart(data) {
        const ctx = document.getElementById('macroChart').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.date),
                datasets: [{
                    label: 'Liquidez Neta Fed (Trillones $)',
                    data: data.map(d => d.val),
                    borderColor: '#d4af37',
                    backgroundColor: 'rgba(212, 175, 55, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#8b949e', maxRotation: 0, autoSkip: true, maxTicksLimit: 5 } },
                    y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    window.onload = () => { fetchAllData(); };
</script>
