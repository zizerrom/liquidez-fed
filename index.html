<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Druckenmiller Dashboard - Datos Directos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --gold: #d4af37; --up: #238636; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .card h3 { font-size: 0.75rem; color: var(--gold); margin: 0 0 10px 0; }
        .val { font-size: 1.5rem; font-weight: bold; }
        .signal-box { margin: 20px 0; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; border: 1px solid var(--gold); background: rgba(212, 175, 55, 0.1); }
        .chart-container { background: var(--card); padding: 15px; border-radius: 8px; margin-top: 20px; height: 300px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--gold); text-align: center; margin:0;">MACRO LIQUIDITY ENGINE</h1>
    
    <div id="mainSignal" class="signal-box">CARGANDO INDICADORES...</div>

    <div class="grid">
        <div class="card">
            <h3>Rendimiento 10Y US (^TNX)</h3>
            <div id="yield10y" class="val">---</div>
        </div>
        <div class="card">
            <h3>Volatilidad VIX (^VIX)</h3>
            <div id="vixVal" class="val">---</div>
        </div>
        <div class="card">
            <h3>S&P 500 (^GSPC)</h3>
            <div id="spxVal" class="val">---</div>
        </div>
        <div class="card">
            <h3>Estado de Red</h3>
            <div id="statusVal" class="val" style="color: var(--up); font-size: 1rem;">Conectado</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="macroChart"></canvas>
    </div>
</div>

<script>
    async function fetchYahooData(symbol) {
        try {
            const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1mo`);
            const data = await res.json();
            const result = data.chart.result[0];
            const prices = result.indicators.quote[0].close;
            const dates = result.timestamp.map(ts => new Date(ts * 1000).toLocaleDateString());
            return { prices: prices.filter(p => p !== null), dates };
        } catch (e) {
            console.error(`Error cargando ${symbol}:`, e);
            return null;
        }
    }

    async function initDashboard() {
        const [tnx, vix, spx] = await Promise.all([
            fetchYahooData('^TNX'),
            fetchYahooData('^VIX'),
            fetchYahooData('^GSPC')
        ]);

        if (tnx && tnx.prices.length) {
            document.getElementById('yield10y').innerText = `${tnx.prices[tnx.prices.length - 1].toFixed(2)}%`;
        }
        if (vix && vix.prices.length) {
            document.getElementById('vixVal').innerText = vix.prices[vix.prices.length - 1].toFixed(2);
        }
        if (spx && spx.prices.length) {
            document.getElementById('spxVal').innerText = Math.round(spx.prices[spx.prices.length - 1]);
        }

        const signalBox = document.getElementById('mainSignal');
        const currentVix = vix ? vix.prices[vix.prices.length - 1] : 20;

        if (currentVix < 18) {
            signalBox.innerText = "SEÑAL: ENTORNO ALCISTA / EXPANSIVO";
            signalBox.style.color = "var(--up)";
        } else {
            signalBox.innerText = "SEÑAL: PRECAUCIÓN / ELEVADA VOLATILIDAD";
            signalBox.style.color = "var(--gold)";
        }

        if (spx) {
            const ctx = document.getElementById('macroChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: spx.dates.slice(-15),
                    datasets: [{
                        label: 'S&P 500 (Últimos 15 días)',
                        data: spx.prices.slice(-15),
                        borderColor: '#d4af37',
                        backgroundColor: 'rgba(212, 175, 55, 0.1)',
                        fill: true
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    }

    window.onload = initDashboard;
</script>
</body>
</html>
